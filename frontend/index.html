<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses Release App</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      #root {
        max-width: 1200px;
        margin: 0 auto;
      }
      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        padding: 30px;
      }
      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 2rem;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 0.95rem;
      }
      .filters {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }
      .filters input,
      .filters select,
      .filters button {
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.95rem;
      }
      .filters button {
        background: #667eea;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }
      .filters button:hover {
        background: #5568d3;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
      }
      .summary-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }
      .summary-card h3 {
        font-size: 0.85rem;
        font-weight: 500;
        opacity: 0.9;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .summary-card .value {
        font-size: 1.8rem;
        font-weight: 700;
      }
      .table-container {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        background: #f8f9fa;
        padding: 12px;
        text-align: left;
        font-weight: 600;
        color: #555;
        border-bottom: 2px solid #dee2e6;
        font-size: 0.9rem;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid #e9ecef;
        color: #333;
      }
      tr:hover {
        background: #f8f9fa;
      }
      .category-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 500;
        background: #e7f3ff;
        color: #0066cc;
      }
      .amount {
        font-weight: 600;
        color: #28a745;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
        font-size: 1.1rem;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border: 1px solid #f5c6cb;
      }

      /* ── Edit button ── */
      .btn-edit {
        padding: 5px 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-edit:hover {
        background: #5568d3;
      }
      .btn-edit:focus {
        outline: 3px solid #764ba2;
        outline-offset: 2px;
      }

      /* ── Modal overlay ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
      }
      .modal-box {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 480px;
        padding: 28px 32px;
        position: relative;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }
      .modal-header h2 {
        font-size: 1.3rem;
        color: #333;
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 1.4rem;
        color: #666;
        cursor: pointer;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 4px;
        transition: background 0.15s;
      }
      .modal-close:hover {
        background: #f0f0f0;
        color: #333;
      }
      .modal-close:focus {
        outline: 3px solid #667eea;
        outline-offset: 2px;
      }

      /* ── Form fields ── */
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.95rem;
        color: #333;
        transition: border-color 0.2s;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      }
      .form-group input:disabled,
      .form-group select:disabled {
        background: #f5f5f5;
        color: #888;
        cursor: not-allowed;
      }
      .field-error {
        border-color: #dc3545 !important;
      }
      .field-error-msg {
        display: block;
        margin-top: 5px;
        font-size: 0.82rem;
        color: #dc3545;
        font-weight: 500;
      }

      /* ── Modal banners ── */
      .modal-banner-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        border-radius: 6px;
        padding: 12px 15px;
        margin-bottom: 18px;
        font-size: 0.9rem;
      }
      .modal-banner-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
        border-radius: 6px;
        padding: 16px 15px;
        margin-bottom: 18px;
        font-size: 0.95rem;
        font-weight: 600;
        text-align: center;
      }

      /* ── Modal footer buttons ── */
      .modal-footer {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 24px;
      }
      .btn-cancel {
        padding: 9px 20px;
        background: white;
        color: #555;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-cancel:hover {
        background: #f5f5f5;
      }
      .btn-cancel:focus {
        outline: 3px solid #667eea;
        outline-offset: 2px;
      }
      .btn-save {
        padding: 9px 22px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        min-width: 90px;
      }
      .btn-save:hover:not(:disabled) {
        background: #5568d3;
      }
      .btn-save:disabled {
        background: #aab4f0;
        cursor: not-allowed;
      }
      .btn-save:focus {
        outline: 3px solid #764ba2;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const API_BASE = "http://localhost:3001/api";

      const ALLOWED_CATEGORIES = [
        "Travel",
        "Meals",
        "Accommodation",
        "Office Supplies",
        "Software",
        "Training",
      ];

      // Returns true if the expense date is more than 90 days before today
      function isOlderThan90Days(dateStr) {
        const expenseDate = new Date(dateStr + "T00:00:00Z");
        const today = new Date();
        today.setUTCHours(0, 0, 0, 0);
        const diffDays =
          (today.getTime() - expenseDate.getTime()) / (1000 * 60 * 60 * 24);
        return diffDays > 90;
      }

      function App() {
        const [expenses, setExpenses] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [total, setTotal] = useState(0);
        const [count, setCount] = useState(0);

        // Filters
        const [category, setCategory] = useState("");
        const [dateFrom, setDateFrom] = useState("");
        const [dateTo, setDateTo] = useState("");

        // ── Edit modal state ──
        const [editingExpense, setEditingExpense] = useState(null); // null = closed
        const [editForm, setEditForm] = useState({
          date: "",
          category: "",
          amount: "",
          description: "",
        });
        const [editErrors, setEditErrors] = useState({});
        const [editSaving, setEditSaving] = useState(false);
        const [editApiError, setEditApiError] = useState("");
        const [editSuccess, setEditSuccess] = useState(false);
        const [editLocked, setEditLocked] = useState(false);
        const modalCloseRef = useRef(null);

        const fetchExpenses = async () => {
          setLoading(true);
          setError(null);
          try {
            const params = new URLSearchParams();
            if (category) params.append("category", category);
            if (dateFrom) params.append("dateFrom", dateFrom);
            if (dateTo) params.append("dateTo", dateTo);

            const response = await fetch(`${API_BASE}/expenses?${params}`);
            if (!response.ok) throw new Error("Failed to fetch expenses");

            const data = await response.json();
            setExpenses(data.data);
            setTotal(data.total);
            setCount(data.count);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          fetchExpenses();
        }, []);

        const handleFilter = () => {
          fetchExpenses();
        };

        const handleReset = () => {
          setCategory("");
          setDateFrom("");
          setDateTo("");
          setTimeout(() => fetchExpenses(), 0);
        };

        // ── Edit modal functions ──

        const openEditModal = (expense) => {
          setEditingExpense(expense);
          setEditForm({
            date: expense.date,
            category: expense.category,
            amount: String(expense.amount),
            description: expense.description || "",
          });
          setEditErrors({});
          setEditApiError("");
          setEditSuccess(false);
          setEditSaving(false);
          setEditLocked(isOlderThan90Days(expense.date));
          // Focus the close button after modal opens
          setTimeout(() => {
            if (modalCloseRef.current) modalCloseRef.current.focus();
          }, 50);
        };

        const closeEditModal = () => {
          setEditingExpense(null);
          setEditForm({ date: "", category: "", amount: "", description: "" });
          setEditErrors({});
          setEditApiError("");
          setEditSuccess(false);
          setEditSaving(false);
          setEditLocked(false);
        };

        const validateEditForm = () => {
          const errors = {};
          if (!editForm.date) {
            errors.date = "Date is required";
          } else if (
            !/^\d{4}-\d{2}-\d{2}$/.test(editForm.date) ||
            isNaN(Date.parse(editForm.date))
          ) {
            errors.date = "Date must be in YYYY-MM-DD format";
          }
          if (!editForm.category) {
            errors.category = "Field category is required";
          } else if (!ALLOWED_CATEGORIES.includes(editForm.category)) {
            errors.category = "Invalid category";
          }
          const parsedAmount = parseFloat(editForm.amount);
          if (editForm.amount === "" || editForm.amount === null) {
            errors.amount = "Amount must be a positive number";
          } else if (isNaN(parsedAmount) || parsedAmount <= 0) {
            errors.amount = "Amount must be a positive number";
          }
          return errors;
        };

        const handleEditFieldChange = (field, value) => {
          setEditForm((prev) => ({ ...prev, [field]: value }));
          // Clear the error for this field as soon as the user changes it
          setEditErrors((prev) => {
            const next = { ...prev };
            delete next[field];
            return next;
          });
        };

        const handleEditSave = async () => {
          const errors = validateEditForm();
          if (Object.keys(errors).length > 0) {
            setEditErrors(errors);
            return;
          }
          setEditSaving(true);
          setEditApiError("");
          try {
            const response = await fetch(
              `${API_BASE}/expenses/${editingExpense.id}`,
              {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  date: editForm.date,
                  category: editForm.category,
                  amount: parseFloat(editForm.amount),
                  description: editForm.description,
                }),
              },
            );
            const data = await response.json();
            if (!response.ok) {
              setEditApiError(
                data.error || "Failed to save. Please try again.",
              );
              setEditSaving(false);
              return;
            }
            // Update the expense in the local list and recalculate totals
            const updatedExpense = data.data[0];
            setExpenses((prev) =>
              prev.map((e) =>
                e.id === updatedExpense.id ? updatedExpense : e,
              ),
            );
            setTotal((prev) => {
              const oldAmount = editingExpense.amount;
              return parseFloat(
                (prev - oldAmount + updatedExpense.amount).toFixed(2),
              );
            });
            setEditSuccess(true);
            setEditSaving(false);
            // Close modal after 2-second confirmation period (per spec § Edit Form States)
            setTimeout(closeEditModal, 2000);
          } catch (err) {
            setEditApiError("Failed to save. Please try again.");
            setEditSaving(false);
          }
        };

        // Close modal on Escape key
        const handleModalKeyDown = (e) => {
          if (e.key === "Escape") closeEditModal();
        };

        return (
          <div className="container">
            <h1>💰 Expenses Release App</h1>
            <p className="subtitle">
              Simple expense tracking prototype using CSV backend
            </p>

            <div className="filters">
              <select
                value={category}
                onChange={(e) => setCategory(e.target.value)}
              >
                <option value="">All Categories</option>
                <option value="Travel">Travel</option>
                <option value="Meals">Meals</option>
                <option value="Accommodation">Accommodation</option>
                <option value="Office Supplies">Office Supplies</option>
                <option value="Software">Software</option>
                <option value="Training">Training</option>
              </select>
              <input
                type="date"
                value={dateFrom}
                onChange={(e) => setDateFrom(e.target.value)}
                placeholder="From date"
              />
              <input
                type="date"
                value={dateTo}
                onChange={(e) => setDateTo(e.target.value)}
                placeholder="To date"
              />
              <button onClick={handleFilter}>Apply Filters</button>
              <button onClick={handleReset} style={{ background: "#6c757d" }}>
                Reset
              </button>
            </div>

            {error && <div className="error">⚠️ {error}</div>}

            {!loading && !error && (
              <>
                <div className="summary">
                  <div className="summary-card">
                    <h3>Total Expenses</h3>
                    <div className="value">${total.toFixed(2)}</div>
                  </div>
                  <div className="summary-card">
                    <h3>Number of Records</h3>
                    <div className="value">{count}</div>
                  </div>
                  <div className="summary-card">
                    <h3>Average Amount</h3>
                    <div className="value">
                      ${count > 0 ? (total / count).toFixed(2) : "0.00"}
                    </div>
                  </div>
                </div>

                <div className="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {expenses.length === 0 ? (
                        <tr>
                          <td
                            colSpan="5"
                            style={{
                              textAlign: "center",
                              padding: "30px",
                              color: "#999",
                            }}
                          >
                            No expenses found
                          </td>
                        </tr>
                      ) : (
                        expenses.map((expense) => (
                          <tr key={expense.id}>
                            <td>{expense.date}</td>
                            <td>
                              <span className="category-badge">
                                {expense.category}
                              </span>
                            </td>
                            <td>{expense.description}</td>
                            <td className="amount">
                              ${expense.amount.toFixed(2)} {expense.currency}
                            </td>
                            <td>
                              <button
                                className="btn-edit"
                                onClick={() => openEditModal(expense)}
                                aria-label={`Edit expense: ${expense.description || expense.category} on ${expense.date}`}
                              >
                                Edit
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </>
            )}

            {loading && <div className="loading">Loading expenses...</div>}

            {/* ── Edit Modal ── */}
            {editingExpense && (
              <div
                className="modal-overlay"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modal-title"
                onKeyDown={handleModalKeyDown}
              >
                <div className="modal-box">
                  <div className="modal-header">
                    <h2 id="modal-title">Edit Expense</h2>
                    <button
                      className="modal-close"
                      onClick={closeEditModal}
                      aria-label="Close edit modal"
                      ref={modalCloseRef}
                    >
                      ×
                    </button>
                  </div>

                  {/* Success state */}
                  {editSuccess && (
                    <div className="modal-banner-success" role="status">
                      ✅ Expense updated successfully
                    </div>
                  )}

                  {/* Locked state banner */}
                  {editLocked && !editSuccess && (
                    <div className="modal-banner-error" role="alert">
                      Cannot edit expenses older than 90 days
                    </div>
                  )}

                  {/* API error banner */}
                  {editApiError && !editSuccess && (
                    <div className="modal-banner-error" role="alert">
                      ⚠️ {editApiError}
                    </div>
                  )}

                  {/* Date field */}
                  <div className="form-group">
                    <label htmlFor="edit-date">Date</label>
                    <input
                      id="edit-date"
                      type="text"
                      value={editForm.date}
                      onChange={(e) =>
                        handleEditFieldChange("date", e.target.value)
                      }
                      disabled={editLocked || editSaving || editSuccess}
                      placeholder="YYYY-MM-DD"
                      className={editErrors.date ? "field-error" : ""}
                      aria-describedby={
                        editErrors.date ? "edit-date-error" : undefined
                      }
                      aria-invalid={!!editErrors.date}
                    />
                    {editErrors.date && (
                      <span
                        id="edit-date-error"
                        className="field-error-msg"
                        role="alert"
                      >
                        {editErrors.date}
                      </span>
                    )}
                  </div>

                  {/* Category field */}
                  <div className="form-group">
                    <label htmlFor="edit-category">Category</label>
                    <select
                      id="edit-category"
                      value={editForm.category}
                      onChange={(e) =>
                        handleEditFieldChange("category", e.target.value)
                      }
                      disabled={editLocked || editSaving || editSuccess}
                      className={editErrors.category ? "field-error" : ""}
                      aria-describedby={
                        editErrors.category ? "edit-category-error" : undefined
                      }
                      aria-invalid={!!editErrors.category}
                    >
                      <option value="">Select a category</option>
                      {ALLOWED_CATEGORIES.map((cat) => (
                        <option key={cat} value={cat}>
                          {cat}
                        </option>
                      ))}
                    </select>
                    {editErrors.category && (
                      <span
                        id="edit-category-error"
                        className="field-error-msg"
                        role="alert"
                      >
                        {editErrors.category}
                      </span>
                    )}
                  </div>

                  {/* Amount field */}
                  <div className="form-group">
                    <label htmlFor="edit-amount">Amount (USD)</label>
                    <input
                      id="edit-amount"
                      type="number"
                      step="0.01"
                      min="0.01"
                      value={editForm.amount}
                      onChange={(e) =>
                        handleEditFieldChange("amount", e.target.value)
                      }
                      disabled={editLocked || editSaving || editSuccess}
                      className={editErrors.amount ? "field-error" : ""}
                      aria-describedby={
                        editErrors.amount ? "edit-amount-error" : undefined
                      }
                      aria-invalid={!!editErrors.amount}
                    />
                    {editErrors.amount && (
                      <span
                        id="edit-amount-error"
                        className="field-error-msg"
                        role="alert"
                      >
                        {editErrors.amount}
                      </span>
                    )}
                  </div>

                  {/* Description field (optional) */}
                  <div className="form-group">
                    <label htmlFor="edit-description">
                      Description{" "}
                      <span style={{ fontWeight: 400, color: "#888" }}>
                        (optional)
                      </span>
                    </label>
                    <input
                      id="edit-description"
                      type="text"
                      value={editForm.description}
                      onChange={(e) =>
                        handleEditFieldChange("description", e.target.value)
                      }
                      disabled={editLocked || editSaving || editSuccess}
                    />
                  </div>

                  {/* Footer buttons */}
                  <div className="modal-footer">
                    <button
                      className="btn-cancel"
                      onClick={closeEditModal}
                      disabled={editSaving}
                    >
                      {editLocked ? "Close" : "Cancel"}
                    </button>
                    {!editLocked && !editSuccess && (
                      <button
                        className="btn-save"
                        onClick={handleEditSave}
                        disabled={
                          editSaving || Object.keys(editErrors).length > 0
                        }
                        aria-busy={editSaving}
                      >
                        {editSaving ? "Saving…" : "Save"}
                      </button>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
