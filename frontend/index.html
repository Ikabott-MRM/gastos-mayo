<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses Release App</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      #root {
        max-width: 1200px;
        margin: 0 auto;
      }
      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        padding: 30px;
      }
      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 2rem;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 0.95rem;
      }
      .filters {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }
      .filters input,
      .filters select,
      .filters button {
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.95rem;
      }
      .filters button {
        background: #667eea;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }
      .filters button:hover {
        background: #5568d3;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
      }
      .summary-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }
      .summary-card h3 {
        font-size: 0.85rem;
        font-weight: 500;
        opacity: 0.9;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .summary-card .value {
        font-size: 1.8rem;
        font-weight: 700;
      }
      .table-container {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        background: #f8f9fa;
        padding: 12px;
        text-align: left;
        font-weight: 600;
        color: #555;
        border-bottom: 2px solid #dee2e6;
        font-size: 0.9rem;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid #e9ecef;
        color: #333;
      }
      tr:hover {
        background: #f8f9fa;
      }
      .category-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 500;
        background: #e7f3ff;
        color: #0066cc;
      }
      .amount {
        font-weight: 600;
        color: #28a745;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
        font-size: 1.1rem;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const API_BASE = "http://localhost:3001/api";

      function App() {
        const [expenses, setExpenses] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [total, setTotal] = useState(0);
        const [count, setCount] = useState(0);

        // Filters
        const [category, setCategory] = useState("");
        const [dateFrom, setDateFrom] = useState("");
        const [dateTo, setDateTo] = useState("");

        const fetchExpenses = async () => {
          setLoading(true);
          setError(null);
          try {
            const params = new URLSearchParams();
            if (category) params.append("category", category);
            if (dateFrom) params.append("dateFrom", dateFrom);
            if (dateTo) params.append("dateTo", dateTo);

            const response = await fetch(`${API_BASE}/expenses?${params}`);
            if (!response.ok) throw new Error("Failed to fetch expenses");

            const data = await response.json();
            setExpenses(data.expenses);
            setTotal(data.total);
            setCount(data.count);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          fetchExpenses();
        }, []);

        const handleFilter = () => {
          fetchExpenses();
        };

        const handleReset = () => {
          setCategory("");
          setDateFrom("");
          setDateTo("");
          setTimeout(() => fetchExpenses(), 0);
        };

        return (
          <div className="container">
            <h1>💰 Expenses Release App</h1>
            <p className="subtitle">
              Simple expense tracking prototype using CSV backend
            </p>

            <div className="filters">
              <select
                value={category}
                onChange={(e) => setCategory(e.target.value)}
              >
                <option value="">All Categories</option>
                <option value="Travel">Travel</option>
                <option value="Meals">Meals</option>
                <option value="Accommodation">Accommodation</option>
                <option value="Office Supplies">Office Supplies</option>
                <option value="Software">Software</option>
                <option value="Training">Training</option>
              </select>
              <input
                type="date"
                value={dateFrom}
                onChange={(e) => setDateFrom(e.target.value)}
                placeholder="From date"
              />
              <input
                type="date"
                value={dateTo}
                onChange={(e) => setDateTo(e.target.value)}
                placeholder="To date"
              />
              <button onClick={handleFilter}>Apply Filters</button>
              <button onClick={handleReset} style={{ background: "#6c757d" }}>
                Reset
              </button>
            </div>

            {error && <div className="error">⚠️ {error}</div>}

            {!loading && !error && (
              <>
                <div className="summary">
                  <div className="summary-card">
                    <h3>Total Expenses</h3>
                    <div className="value">${total.toFixed(2)}</div>
                  </div>
                  <div className="summary-card">
                    <h3>Number of Records</h3>
                    <div className="value">{count}</div>
                  </div>
                  <div className="summary-card">
                    <h3>Average Amount</h3>
                    <div className="value">
                      ${count > 0 ? (total / count).toFixed(2) : "0.00"}
                    </div>
                  </div>
                </div>

                <div className="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                      </tr>
                    </thead>
                    <tbody>
                      {expenses.length === 0 ? (
                        <tr>
                          <td
                            colSpan="4"
                            style={{
                              textAlign: "center",
                              padding: "30px",
                              color: "#999",
                            }}
                          >
                            No expenses found
                          </td>
                        </tr>
                      ) : (
                        expenses.map((expense) => (
                          <tr key={expense.id}>
                            <td>{expense.date}</td>
                            <td>
                              <span className="category-badge">
                                {expense.category}
                              </span>
                            </td>
                            <td>{expense.description}</td>
                            <td className="amount">
                              ${expense.amount.toFixed(2)} {expense.currency}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </>
            )}

            {loading && <div className="loading">Loading expenses...</div>}
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
